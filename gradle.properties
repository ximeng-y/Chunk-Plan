# Gradle 运行参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 本机 JDK 安装路径（供 toolchain 自动检测；也兼容从 JAVA_HOME 运行）
# JDK 21 = neoforge/fabric/common（1.21.1）；JDK 17 = forge（1.20.1 官方要求 Java 17）
org.gradle.java.installations.paths=D:\\Games\\ABOUT_MINECRAFT\\JAVA\\zulu21.44.17-ca-jdk21.0.8-win_x64,D:\\Games\\ABOUT_MINECRAFT\\JAVA\\zulu17.62.17-ca-jdk17.0.17-win_x64

# 项目元信息
mod_id=chunkplan
mod_name=ChunkPlan
mod_version=0.1.0
mod_group=dev.chunkplan
mod_authors=xm2nd

# Java
java_version=21

# 双加载器版本（与官方 MDK / fabric-example-mod 对齐）
# NeoForge 1.21.1（MDK archive/1.21 分支官方 pin）
neoforge_version=21.1.176
neo_gradle_version=7.0.170
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# Fabric 1.21.1（loader 0.16.x 与 fabric-api 0.116.15 兼容性已确认）
fabric_loader_version=0.16.14
fabric_api_version=0.116.15+1.21.1
loom_version=1.13.6

# Forge 1.20.1（ForgeGradle 6，官方 mojmap；1.20.1 官方 Java 要求为 17，故独立一套版本键）
forge_gradle_version=6.0.54
forge_version=47.4.22
forge_minecraft_version=1.20.1
forge_minecraft_version_range=[1.20.1,1.20.2)
forge_java_version=17

# common 引擎编译期依赖
gson_version=2.11.0
slf4j_version=2.0.9
junit_version=5.10.2
