// fabric：Fabric 1.21.1 薄壳（Loom + 官方 mojmap，与 neoforge 代码对齐）

plugins {
    id 'java'
    id 'fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'chunkplan-fabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}" as int)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation project(':common')
}

// common 引擎源码并入本模块编译（与 neoforge 一致）：发布 jar 直接包含 common 类
sourceSets {
    main {
        java.srcDir project(':common').sourceSets.main.java.srcDirs
    }
}

processResources {
    inputs.property 'mod_id', "${mod_id}"
    inputs.property 'mod_name', "${mod_name}"
    inputs.property 'mod_version', "${mod_version}"
    inputs.property 'mod_authors', "${mod_authors}"
    inputs.property 'minecraft_version', "${minecraft_version}"
    filesMatching('fabric.mod.json') {
        expand 'mod_id': "${mod_id}", 'mod_name': "${mod_name}", 'mod_version': "${mod_version}",
                'mod_authors': "${mod_authors}", 'minecraft_version': "${minecraft_version}"
    }
}

loom {
    runs {
        client {
            // 客户端自动化实测辅助：-PquickPlay 时自动加入 localhost 服务器（否则停在主菜单）
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlayMultiplayer', (project.findProperty('quickPlay') ?: 'localhost:25565')
                // 无人值守会话窗口合成异常时用独占全屏绕过（渲染直出 GPU）
                if (project.hasProperty('fullscreen')) {
                    programArgs '--fullscreen'
                }
            }
        }
    }
}
