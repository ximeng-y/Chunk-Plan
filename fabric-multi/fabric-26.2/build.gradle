// fabric-26.2：非混淆版本（官方名内嵌、无映射、无 yarn），Loom 非混淆插件（坑 #33）
plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'dev.chunkplan'
// 产物名已含版本号（chunkplan-<版本>-<加载器>-<MC版本>），置空 version 避免追加 -0.1.0 尾部后缀
version = ''

base {
    archivesName = "chunkplan-${mod_version}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}" as int)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.x 非混淆：官方 jar 直接可编译，无 mappings；loader/api 走 implementation（官方 26.1 迁移博客）
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// common 引擎 + 多版本共享壳层源码并入本模块编译（发布 jar 直接包含 common 类）；
// 跨版本编译失败的类从 shared 移出放本模块 src/main/java（坑 #33）
sourceSets {
    main {
        java.srcDir '../shared/src/main/java'
        java.srcDir '../../common/src/main/java'
    }
}

processResources {
    inputs.property 'mod_id', "${mod_id}"
    inputs.property 'mod_name', "${mod_name}"
    inputs.property 'mod_version', "${mod_version}"
    inputs.property 'mod_authors', "${mod_authors}"
    inputs.property 'minecraft_version', "${minecraft_version}"
    filesMatching('fabric.mod.json') {
        expand 'mod_id': "${mod_id}", 'mod_name': "${mod_name}", 'mod_version': "${mod_version}",
                'mod_authors': "${mod_authors}", 'minecraft_version': "${minecraft_version}"
    }
}
