#额度线窗口（1~4 条，与 lineLimits 一一对应），全部满才拒绝。支持 5h/24h/30m/7d 或纯秒数
lines = ["5h", "24h"]
#各额度线点数上限（与 lines 一一对应）
lineLimits = [500.0, 2000.0]
#踏入未探索区块（集合外）的费用
# Default: 1.0
# Range: 0.0 ~ 1.7976931348623157E308
firstEntryFee = 1.0
#踏入已探索区块（集合内）的费用
# Default: 0.05
# Range: 0.0 ~ 1.7976931348623157E308
familiarEntryFee = 0.05
#高速移动判定阈值（格/tick），超过则费用加倍
# Default: 1.0
# Range: 0.0 ~ 1.7976931348623157E308
highSpeedThreshold = 1.0
#高速移动费用倍率（0 = 高速不额外计费）
# Default: 2.0
# Range: 0.0 ~ 1.7976931348623157E308
highSpeedMultiplier = 2.0
#默认豁免 OP；false 时仅名单豁免（exemptByDefault=false 时全员受限即此值控制 OP）
exemptByDefault = true
#额外豁免玩家 UUID 名单
exemptPlayers = []
#玩家数据落盘周期（秒）
# Default: 300
# Range: 10 ~ 9223372036854775807
saveIntervalSec = 300
#临时封禁扫描周期（秒）
# Default: 30
# Range: 5 ~ 9223372036854775807
banScanIntervalSec = 30
#扣费事件写入独立日志文件（logs/chunkplan.log）
logFeeEvents = true
