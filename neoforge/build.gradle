// neoforge：NeoForge 1.21.1 薄壳（版本与 MDK archive/1.21 官方 pin 对齐）

plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version "${neo_gradle_version}"
}

base {
    archivesName = 'chunkplan-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}" as int)
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
}

// NeoForge 21.1 dev 运行时 mod 类在独立模块层（classpath 库不可见，JPMS 隔离）。
// common 引擎源码直接并入本模块编译：dev 与发布 jar 均包含 common 类（无需 jarJar）。
sourceSets {
    main {
        java.srcDir project(':common').sourceSets.main.java.srcDirs
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }
    server {
        programArgument '--nogui'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id          : "${mod_id}",
            mod_name        : "${mod_name}",
            mod_version     : "${mod_version}",
            mod_authors     : "${mod_authors}",
            minecraft_version_range: "${minecraft_version_range}",
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
